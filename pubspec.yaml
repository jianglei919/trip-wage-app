name: trip_wage_app
description: "Trip Wage - 本地行程收入记录应用"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # 数据
  drift: ^2.20.0
  drift_flutter: ^0.2.0
  path_provider: ^2.1.0
  path: ^1.9.0
  sqlite3_flutter_libs: ^0.5.0

  # 状态 / 路由
  flutter_riverpod: ^2.5.0
  go_router: ^14.0.0

  # UI / 图表
  fl_chart: ^0.68.0

  # 工具
  intl: ^0.19.0
  collection: ^1.18.0
  shared_preferences: ^2.2.0
  excel: ^4.0.0
  share_plus: ^10.0.0
  file_picker: ^8.0.0

  # OCR / 拍照
  image_picker: ^1.1.0
  google_mlkit_text_recognition: ^0.13.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.20.0
  build_runner: ^2.4.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon_android.png"
  image_path_ios: "assets/icon_ios.png"
  min_sdk_android: 21
  adaptive_icon_background: "#A1C4FD"
  adaptive_icon_foreground: "assets/icon_android.png"

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/logo.svg
